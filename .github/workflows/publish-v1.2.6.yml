name: Publish APS 1.2.6
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.2.6.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aps-release-v1.2.6
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'eternal-fly/research-skills'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: eternal-fly/research-skills
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test current sources
        run: |
          python -m pip install -r skills/aps-quantum-writing/requirements.txt
          python -m unittest discover -s scripts -p 'test_build_release*.py' -v
          cd skills/aps-quantum-writing
          python -m unittest discover -s tests -v
      - name: Build and independently check installable archive
        run: |
          python scripts/build_release_1_2_6.py --out dist
          python -m zipfile -e dist/aps-quantum-writing-1.2.6.zip smoke
          cd smoke/aps-quantum-writing
          sha256sum --check SHA256SUMS
          python -B scripts/validate_figure_plan.py assets/schematic-examples/figure-plan.json
          python -B scripts/draw_data_figures.py --out "$RUNNER_TEMP/data-figure-gallery.pdf"
          python -B scripts/draw_floquet_example.py --out "$RUNNER_TEMP/aps-floquet-proof"
          python -m unittest discover -s tests -v
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat skills/aps-quantum-writing/VERSION)" = '1.2.6'
          if gh release view v1.2.6 >/dev/null 2>&1; then
            echo 'Release v1.2.6 exists; no overwrite attempted.'
            exit 1
          fi
          tag_sha=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v1.2.6" --jq '.[] | select(.ref == "refs/tags/v1.2.6") | .object.sha')
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo 'Existing tag differs from this source commit; stopping.'
            exit 1
          fi
          gh release create v1.2.6 dist/* --draft --target "$GITHUB_SHA" --title 'APS Quantum Writing v1.2.6' --notes-file skills/aps-quantum-writing/docs/RELEASE-NOTES-1.2.6.md
          mkdir downloaded
          gh release download v1.2.6 --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS)
          cmp dist/SHA256SUMS downloaded/SHA256SUMS
          gh release edit v1.2.6 --draft=false --latest
